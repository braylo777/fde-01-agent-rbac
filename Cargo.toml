[package]
name = "fde-01-agent-rbac"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Scoped tool tokens, delegated agent auth, SCIM provisioning and row-level security for AI agents."
repository = "https://github.com/braylo777/fde-01-agent-rbac"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "fde-01-agent-rbac"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
hmac = "=0.12.1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
